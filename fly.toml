# Fly config for the voice service.
#
# Two settings here are not defaults and both matter:
#   auto_stop_machines = false  - a cold start mid-demo is a lost deal
#   min_machines_running = 1    - keeps the WebSocket endpoint warm
#
# Region iad is Ashburn, which is also Twilio's default US edge. Keeping them
# co-located is worth roughly 40ms of the latency budget.

app = "restaurant-ai-voice"
primary_region = "iad"

[build]
  dockerfile = "services/voice/Dockerfile"

[env]
  APP_ENV = "prod"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 40

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[checks.health]
  type = "http"
  port = 8000
  path = "/health"
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"
