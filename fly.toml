# fly.toml app configuration file generated for restaurant-ai-voice on 2026-08-09T03:53:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'restaurant-ai-voice'
primary_region = 'iad'

[build]
  dockerfile = 'services/voice/Dockerfile'

[deploy]
  release_command = 'bash db/release.sh'

[env]
  APP_ENV = 'prod'
  DEMO_MODE = 'true'
  PORT = '8000'
  PUBLIC_BASE_URL = 'restaurant-ai-voice.fly.dev'
  REALTIME_PROVIDER = 'gemini'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 40

[checks]
  [checks.health]
    port = 8000
    type = 'http'
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
