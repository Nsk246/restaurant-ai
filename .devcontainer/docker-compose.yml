# Devcontainer stack. Separate from the root docker-compose.yml on purpose:
# that one is for running the services alone on your own machine, this one
# also defines the container VS Code attaches to.
services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    command: sleep infinity
    volumes:
      # Explicit target rather than mounting the parent directory. Mounting
      # `..` at /workspaces puts the repo one level deeper than expected and
      # workspaceFolder then points at nothing.
      - ..:/workspaces/restaurant-ai:cached
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: operator
      POSTGRES_PASSWORD: operator
      POSTGRES_DB: operator
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operator"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]

volumes:
  pgdata:
  redisdata:
