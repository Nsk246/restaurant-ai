name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: operator
          POSTGRES_PASSWORD: operator
          POSTGRES_DB: operator
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: operator
      TEST_DATABASE_URL: postgresql://operator:operator@localhost:5432/operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Apply migrations and seed
        run: |
          for f in db/migrations/*.sql db/seed/*.sql; do
            psql -h localhost -U operator -d operator -q -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Schema assertions
        run: |
          psql -h localhost -U operator -d operator -q -v ON_ERROR_STOP=1 \
            -f db/tests/test_schema.sql 2>&1 | sed 's/^.*NOTICE:  //'

      - run: pip install -r services/voice/requirements.txt pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check services/voice

      - name: Tests
        # The order-accuracy suite skips without a database, so assert it did
        # not skip here. A green CI that silently ran 31 of 60 tests is worse
        # than a red one.
        run: |
          cd services/voice
          python -m pytest -q --tb=short | tee /tmp/out.txt
          grep -q "skipped" /tmp/out.txt && { echo "::error::tests skipped in CI"; exit 1; } || true
