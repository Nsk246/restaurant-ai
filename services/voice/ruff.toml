target-version = "py312"
line-length = 90

[lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["S101"]  # assert is how tests are written

[lint.isort]
known-first-party = ["app"]

[lint.per-file-ignores]
# The system prompt is prose the model reads. Rewrapping it to satisfy a
# linter would change what the agent is told.
"app/agent/prompt.py" = ["E501"]
"tests/*" = ["S105", "S106"]  # test credentials are not secrets
# Fake phone numbers and plausible latencies for a demo. Nothing here is a
# security decision, so the cryptographic-randomness rule does not apply.
"tools/*" = ["S311"]
